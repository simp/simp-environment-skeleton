---

# This is the empty SIMP scenario hiera file
#
# If you are beginning to use SIMP and don't want to include any classes by default,
# this is the scenario for you.
#
# SIMP catalysts defined in simp_options all default to `false` and are disabled
# by default, allowing you to set up your infrastructure as you need,
# piece by piece.
#
# See `manifests/site.pp` for an example use case for the $simp_scenario variable.
#
# NOTE: Details for the 'poss' scenario can be found in the
# 'simp::scenario::poss' class

simp::scenario: 'poss'

# Compliance profiles to enforce with the Compliance Engine (see hiera.yaml).
# `simp:defaults` restores the SIMP behavior that modules no longer apply
# by default.
#
# To enforce a DISA STIG profile, list it *before* `simp:defaults`; for scalar
# values the first-listed profile wins:
#
#   compliance_engine::enforcement:
#     - disa:mac-1:classified
#     - simp:defaults
#
# Setting this key at a higher Hiera level replaces this list; it is not
# merged.
compliance_engine::enforcement:
  - simp:defaults
